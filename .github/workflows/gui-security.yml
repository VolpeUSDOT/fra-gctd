name: GUI Security Tests

on:
  pull_request:
    paths:
      - 'fra-gctd-gui/**'
      - '.github/workflows/gui-security.yml'
  push:
    branches: [master]
    paths:
      - 'fra-gctd-gui/**'
      - '.github/workflows/gui-security.yml'

permissions:
  contents: read

jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fra-gctd-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fra-gctd-gui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:electron
      - run: npm run package
      - run: npm run test:package
